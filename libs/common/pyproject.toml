[project]
name = "alex-common"
version = "0.1.0"
description = "Shared utilities, observability, and Bedrock client for Alex"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.8",
    "langfuse>=3.3.4",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alex_common"]
